<!DOCTYPE html>
<!--
==================================================
WEDDING MOBILE PREVIEW HTML

Версия: wedding-mobile-preview-html-001

ИЗМЕНЕНИЯ:
- создан отдельный preview-файл для разработки мобильной версии страницы «Свадьба»
- desktop-файлы Wedding не затрагиваются
- подключены общие стили меню, popup и page transition
- подключены отдельные файлы wedding-mobile.css и wedding-mobile.js
- страница wedding-mobile.html загружается через fetch по общей архитектуре проекта
==================================================
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Свадьба — Иван Перцев</title>

  <link rel="preload" href="./assets/fonts/Benzin-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/img/wedding/mobile/background/wedding-mobile-bg.webp" as="image">
  <link rel="preload" href="./assets/img/wedding/video/wedding-video-poster.webp" as="image">

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">
  <link rel="stylesheet" href="./css/wedding-mobile.css">
</head>

<body>

  <div
    class="ip-page-transition is-enter"
    aria-hidden="true"
  ></div>

  <main id="ip-wedding-mobile-root"></main>

  <script>
    (function(){
      'use strict';

      var root = document.getElementById('ip-wedding-mobile-root');

      if(!root){
        return;
      }

      function loadScript(src){
        return new Promise(function(resolve, reject){
          var script = document.createElement('script');

          script.src = src;
          script.defer = true;

          script.onload = resolve;
          script.onerror = reject;

          document.body.appendChild(script);
        });
      }

      fetch('./pages/wedding/wedding-mobile.html')
        .then(function(response){
          if(!response.ok){
            throw new Error('Не удалось загрузить wedding-mobile.html');
          }

          return response.text();
        })
        .then(function(html){
          root.innerHTML = html;

          return loadScript('./js/wedding-mobile.js');
        })
        .then(function(){
          return loadScript('./js/page-transition.js');
        })
        .catch(function(error){
          root.innerHTML = '<p style="padding:24px;color:#fff;font-family:Arial,sans-serif;">Ошибка загрузки мобильной страницы «Свадьба».</p>';
          window.console.error(error);
        });
    })();
  </script>

</body>
</html>
