<!--
==================================================
MUSICAL SHOW PREVIEW HTML

Версия: musical-show-preview-html-001-desktop

ИЗМЕНЕНИЯ:
- создан desktop preview-loader страницы «Музыкальное шоу»
- загружает pages/musical-show/musical-show.html, musical-show.css, musical-show-reviews.css и musical-show.js
- подключены home.css, popups.css, popups-mobile.css и page-transition.css
- добавлены preload для desktop background и video poster
- mobile-loader пока не добавлялся, так как создаётся только desktop-версия
==================================================
-->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Музыкальное шоу — Иван Перцев</title>

  <style>
    :root{
      --musical-show-vh:1vh;
    }

    html,
    body,
    #ip-musical-show-root{
      width:100%;
      height:100%;
      min-height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#050603;
    }

    #ip-musical-show-root{
      position:relative;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="preload" href="./assets/img/musical/background/musical-show-bg.webp" as="image">
  <link rel="preload" href="./assets/img/musical/video/musical-show-video-poster.webp" as="image">

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">
  <link rel="stylesheet" href="./css/musical-show.css">
  <link rel="stylesheet" href="./css/musical-show-reviews.css">
</head>

<body>

  <div class="ip-page-transition is-enter" aria-hidden="true"></div>
  <div id="ip-musical-show-root"></div>

  <script>
    (function(){
      'use strict';

      var root = document.getElementById('ip-musical-show-root');

      function setViewportHeight(){
        var height = window.innerHeight;

        if(window.visualViewport && window.visualViewport.height){
          height = window.visualViewport.height;
        }

        document.documentElement.style.setProperty('--musical-show-vh', (height * 0.01) + 'px');
      }

      function loadScript(src){
        return new Promise(function(resolve, reject){
          var script = document.createElement('script');
          script.src = src + '?v=' + Date.now();
          script.defer = true;
          script.onload = resolve;
          script.onerror = reject;
          document.body.appendChild(script);
        });
      }

      if(!root){
        return;
      }

      setViewportHeight();

      fetch('./pages/musical-show/musical-show.html')
        .then(function(response){
          if(!response.ok){
            throw new Error('Ошибка загрузки страницы Музыкальное шоу. Проверь путь: pages/musical-show/musical-show.html');
          }
          return response.text();
        })
        .then(function(html){
          root.innerHTML = html;
          return loadScript('./js/musical-show.js');
        })
        .then(function(){
          if(!document.querySelector('script[data-page-transition-script]')){
            var transitionScript = document.createElement('script');
            transitionScript.src = './js/page-transition.js';
            transitionScript.defer = true;
            transitionScript.setAttribute('data-page-transition-script', 'true');
            document.body.appendChild(transitionScript);
          }
        })
        .catch(function(error){
          console.error(error);
          root.innerHTML = '<pre style="color:#fff;padding:40px;font-family:Arial,sans-serif;">' + error.message + '</pre>';
        });

      window.addEventListener('resize', setViewportHeight, { passive:true });
      window.addEventListener('orientationchange', function(){
        window.setTimeout(setViewportHeight, 250);
      }, { passive:true });

      if(window.visualViewport){
        window.visualViewport.addEventListener('resize', setViewportHeight, { passive:true });
      }
    })();
  </script>

</body>
</html>
