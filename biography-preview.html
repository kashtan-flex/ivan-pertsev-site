<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Версия: biography-preview-006

    ИЗМЕНЕНИЯ:
    - подключен новый файл css/biography-mobile.css для мобильной версии страницы «Биография»
    - сохранено подключение home.css для общего меню
    - сохранено подключение popup и page transition
    - меню не изменялось
  -->

  <title>Биография — Иван Перцев</title>

  <style>
    html,
    body,
    #ip-biography-root{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      background:#050603;
      overflow:hidden;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/biography.css">
  <link rel="stylesheet" href="./css/biography-mobile.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">
</head>

<body>

  <div class="ip-page-transition is-enter" aria-hidden="true"></div>

  <div id="ip-biography-root"></div>

  <script>
    fetch('./pages/biography/biography.html')
      .then(function(response){
        if(!response.ok){
          throw new Error('Не удалось загрузить pages/biography/biography.html');
        }

        return response.text();
      })
      .then(function(html){
        document.getElementById('ip-biography-root').innerHTML = html;

        var script = document.createElement('script');
        script.src = './js/biography.js';
        document.body.appendChild(script);

        var transitionScript = document.createElement('script');
        transitionScript.src = './js/page-transition.js';
        document.body.appendChild(transitionScript);
      })
      .catch(function(error){
        console.error(error);
        document.body.style.background = '#050603';
        document.body.innerHTML = '<pre style="color:#fff;padding:40px;font-family:Arial,sans-serif;">Ошибка загрузки страницы Биография. Проверь путь: pages/biography/biography.html</pre>';
      });
  </script>

</body>
</html>
