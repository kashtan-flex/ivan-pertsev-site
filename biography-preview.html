<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    Версия: biography-preview-001

    ИЗМЕНЕНИЯ:
    - создан отдельный preview-файл для страницы «Биография»
    - подключён css/biography.css
    - подключён js/biography.js
    - сохранены popups.css и popups-mobile.css
  -->

  <title>Биография — Иван Перцев</title>

  <style>
    html,
    body,
    #ip-biography-root{
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
      background:#050603;
    }

    body{
      overflow:hidden;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/biography.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
</head>

<body>

  <div id="ip-biography-root"></div>

  <script>
    fetch('./pages/biography/biography.html')
      .then(function(response){
        return response.text();
      })
      .then(function(html){
        document.getElementById('ip-biography-root').innerHTML = html;

        var script = document.createElement('script');
        script.src = './js/biography.js';
        document.body.appendChild(script);
      });
  </script>

</body>
</html>
