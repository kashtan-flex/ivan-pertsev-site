<!--
==================================================
WEDDING PREVIEW HTML

Версия: wedding-preview-005-mobile-root-html-route

ИЗМЕНЕНИЯ:
- wedding-preview.html сохранён как единая точка входа для desktop и mobile версии страницы «Свадьба»
- исправлен mobile-маршрут: удалено обращение к несуществующему pages/wedding/wedding-mobile.html
- mobile теперь загружает существующий wedding-mobile.html, css/wedding-mobile.css и js/wedding-mobile.js
- desktop по-прежнему загружает pages/wedding/wedding.html, css/wedding.css, css/project-reviews.css и js/wedding.js
- переключение desktop/mobile при изменении ширины viewport сохранено
- popup, page transition и viewport workflow не изменялись
==================================================
-->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Свадьба — Иван Перцев</title>

  <style>
    :root{
      --wedding-vh:1vh;
      --wedding-mobile-vh:1vh;
    }

    html,
    body,
    #ip-wedding-root{
      width:100%;
      margin:0;
      padding:0;
      background:#050603;
    }

    html{
      min-height:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      min-height:calc(var(--wedding-vh) * 100);
      overflow-x:hidden;
    }

    #ip-wedding-root{
      position:relative;
      min-height:100vh;
      min-height:calc(var(--wedding-vh) * 100);
    }

    @media (min-width:768px){

      html,
      body,
      #ip-wedding-root{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
      }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="preload" href="./assets/img/wedding/video/wedding-video-poster.webp" as="image">

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">

</head>

<body>

  <div
    class="ip-page-transition is-enter"
    aria-hidden="true"
  ></div>

  <div id="ip-wedding-root"></div>

  <script>
    (function(){
      'use strict';

      var MOBILE_BREAKPOINT = 767;
      var BREAKPOINT_DEBOUNCE = 120;

      var root = document.getElementById('ip-wedding-root');

      var currentMode = null;
      var resizeTimer = null;
      var loadedPageStyles = [];
      var loadedPageScript = null;
      var loadToken = 0;

      function isMobileViewport(){
        return window.innerWidth <= MOBILE_BREAKPOINT;
      }

      function getMode(){
        return isMobileViewport() ? 'mobile' : 'desktop';
      }

      function setWeddingViewportHeight(){
        var height = window.innerHeight;

        if(window.visualViewport && window.visualViewport.height){
          height = window.visualViewport.height;
        }

        document.documentElement.style.setProperty(
          '--wedding-vh',
          (height * 0.01) + 'px'
        );

        document.documentElement.style.setProperty(
          '--wedding-mobile-vh',
          (height * 0.01) + 'px'
        );
      }

      function loadStylesheet(href){
        return new Promise(function(resolve, reject){
          var existing = document.querySelector(
            'link[data-wedding-page-style][href="' + href + '"]'
          );

          if(existing){
            resolve(existing);
            return;
          }

          var link = document.createElement('link');

          link.rel = 'stylesheet';
          link.href = href;
          link.setAttribute('data-wedding-page-style', 'true');

          link.onload = function(){
            resolve(link);
          };

          link.onerror = reject;

          document.head.appendChild(link);
        });
      }

      function removePageStyles(){
        loadedPageStyles.forEach(function(link){
          if(link && link.parentNode){
            link.parentNode.removeChild(link);
          }
        });

        loadedPageStyles = [];
      }

      function removePageScript(){
        if(loadedPageScript && loadedPageScript.parentNode){
          loadedPageScript.parentNode.removeChild(loadedPageScript);
        }

        loadedPageScript = null;
      }

      function loadScript(src){
        return new Promise(function(resolve, reject){
          var script = document.createElement('script');

          script.src = src + '?v=' + Date.now();
          script.defer = true;
          script.setAttribute('data-wedding-page-script', 'true');

          script.onload = function(){
            loadedPageScript = script;
            resolve(script);
          };

          script.onerror = reject;

          document.body.appendChild(script);
        });
      }

      function getPageConfig(mode){
        if(mode === 'mobile'){
          return {
            mode:'mobile',
            css:[
              './css/wedding-mobile.css'
            ],
            html:'./wedding-mobile.html',
            js:'./js/wedding-mobile.js',
            error:'Ошибка загрузки мобильной страницы Свадьба. Проверь путь: wedding-mobile.html'
          };
        }

        return {
          mode:'desktop',
          css:[
            './css/wedding.css',
            './css/project-reviews.css'
          ],
          html:'./pages/wedding/wedding.html',
          js:'./js/wedding.js',
          error:'Ошибка загрузки страницы Свадьба. Проверь путь: pages/wedding/wedding.html'
        };
      }

      function resetDocumentState(){
        document.documentElement.classList.remove('ip-popup-lock');
        document.body.classList.remove('ip-popup-lock');

        document.documentElement.style.height = '';
        document.body.style.height = '';

        document.documentElement.style.overflowX = '';
        document.body.style.overflowX = '';

        document.documentElement.style.overflowY = '';
        document.body.style.overflowY = '';

        document.documentElement.style.removeProperty('--wedding-scale');
        document.documentElement.style.removeProperty('--wedding-mobile-scale');
        document.documentElement.style.removeProperty('--wedding-mobile-page-height');
      }

      function initViewportListeners(){
        setWeddingViewportHeight();

        window.addEventListener(
          'resize',
          function(){
            setWeddingViewportHeight();
            scheduleBreakpointCheck();
          },
          { passive:true }
        );

        window.addEventListener(
          'orientationchange',
          function(){
            window.setTimeout(function(){
              setWeddingViewportHeight();
              scheduleBreakpointCheck();
            }, 250);
          },
          { passive:true }
        );

        if(window.visualViewport){
          window.visualViewport.addEventListener(
            'resize',
            function(){
              setWeddingViewportHeight();
              scheduleBreakpointCheck();
            },
            { passive:true }
          );
        }
      }

      function scheduleBreakpointCheck(){
        if(resizeTimer){
          window.clearTimeout(resizeTimer);
        }

        resizeTimer = window.setTimeout(function(){
          var nextMode = getMode();

          if(nextMode !== currentMode){
            loadPage(nextMode);
          }
        }, BREAKPOINT_DEBOUNCE);
      }

      function loadPage(mode){
        var config = getPageConfig(mode);
        var token = loadToken + 1;

        loadToken = token;
        currentMode = mode;

        resetDocumentState();
        removePageScript();
        removePageStyles();

        root.innerHTML = '';

        Promise.all(
          config.css.map(function(href){
            return loadStylesheet(href);
          })
        )
          .then(function(links){
            if(token !== loadToken){
              return Promise.reject(new Error('stale-load'));
            }

            loadedPageStyles = links;

            return fetch(config.html);
          })
          .then(function(response){

            if(!response.ok){
              throw new Error(config.error);
            }

            return response.text();
          })
          .then(function(html){

            if(token !== loadToken){
              return Promise.reject(new Error('stale-load'));
            }

            root.innerHTML = html;

            return loadScript(config.js);
          })
          .then(function(){

            if(token !== loadToken){
              return Promise.reject(new Error('stale-load'));
            }

            if(!document.querySelector('script[data-page-transition-script]')){
              var transitionScript = document.createElement('script');

              transitionScript.src = './js/page-transition.js';
              transitionScript.defer = true;
              transitionScript.setAttribute('data-page-transition-script', 'true');

              document.body.appendChild(transitionScript);
            }
          })
          .catch(function(error){

            if(error && error.message === 'stale-load'){
              return;
            }

            console.error(error);

            document.body.style.background = '#050603';

            root.innerHTML =
              '<pre style="color:#fff;padding:40px;font-family:Arial,sans-serif;">' +
              config.error +
              '</pre>';
          });
      }

      if(!root){
        return;
      }

      initViewportListeners();
      loadPage(getMode());

    })();
  </script>

</body>
</html>
