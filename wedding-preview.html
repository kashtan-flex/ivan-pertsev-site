<!--
==================================================
WEDDING PREVIEW HTML

Версия: wedding-preview-001

ИЗМЕНЕНИЯ:
- создан новый preview entry-point страницы «Свадьба»
- сохранена архитектура biography-preview
- добавлен wedding viewport workflow
- подключены wedding.css и общие системы проекта
- сохранены popup и page transition
==================================================
-->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Свадьба — Иван Перцев</title>

  <style>
    :root{
      --wedding-vh:1vh;
    }

    html,
    body,
    #ip-wedding-root{
      width:100%;
      margin:0;
      padding:0;
      background:#050603;
    }

    html{
      min-height:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      min-height:calc(var(--wedding-vh) * 100);
      overflow-x:hidden;
    }

    #ip-wedding-root{
      position:relative;
      min-height:100vh;
      min-height:calc(var(--wedding-vh) * 100);
    }

    @media (min-width:768px){

      html,
      body,
      #ip-wedding-root{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
      }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/wedding.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">

</head>

<body>

  <div
    class="ip-page-transition is-enter"
    aria-hidden="true"
  ></div>

  <div id="ip-wedding-root"></div>

  <script>
    (function(){
      'use strict';

      function setWeddingViewportHeight(){
        var height = window.innerHeight;

        if(window.visualViewport && window.visualViewport.height){
          height = window.visualViewport.height;
        }

        document.documentElement.style.setProperty(
          '--wedding-vh',
          (height * 0.01) + 'px'
        );
      }

      setWeddingViewportHeight();

      window.addEventListener(
        'resize',
        setWeddingViewportHeight,
        { passive:true }
      );

      window.addEventListener(
        'orientationchange',
        function(){
          window.setTimeout(setWeddingViewportHeight, 250);
        },
        { passive:true }
      );

      if(window.visualViewport){
        window.visualViewport.addEventListener(
          'resize',
          setWeddingViewportHeight,
          { passive:true }
        );
      }
    })();
  </script>

  <script>
    fetch('./pages/wedding/wedding.html')
      .then(function(response){

        if(!response.ok){
          throw new Error(
            'Не удалось загрузить pages/wedding/wedding.html'
          );
        }

        return response.text();
      })

      .then(function(html){

        document.getElementById(
          'ip-wedding-root'
        ).innerHTML = html;

        var weddingScript =
          document.createElement('script');

        weddingScript.src =
          './js/wedding.js';

        document.body.appendChild(
          weddingScript
        );

        var transitionScript =
          document.createElement('script');

        transitionScript.src =
          './js/page-transition.js';

        document.body.appendChild(
          transitionScript
        );
      })

      .catch(function(error){

        console.error(error);

        document.body.style.background =
          '#050603';

        document.body.innerHTML =
          '<pre style="color:#fff;padding:40px;font-family:Arial,sans-serif;">Ошибка загрузки страницы Свадьба. Проверь путь: pages/wedding/wedding.html</pre>';
      });
  </script>

</body>
</html>
