<!--
==================================================
WEDDING PREVIEW HTML

Версия: wedding-preview-003-responsive-entry

ИЗМЕНЕНИЯ:
- wedding-preview.html стал единой точкой входа для desktop и mobile версии страницы «Свадьба»
- при ширине экрана до 767px автоматически загружается pages/wedding/wedding-mobile.html
- при ширине экрана от 768px автоматически загружается pages/wedding/wedding.html
- для mobile подключается wedding-mobile.css и wedding-mobile.js
- для desktop подключаются wedding.css, project-reviews.css и wedding.js
- отдельный wedding-mobile-preview.html больше не нужен и может быть удалён
- сохранены popup, page transition и viewport workflow
==================================================
-->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Свадьба — Иван Перцев</title>

  <style>
    :root{
      --wedding-vh:1vh;
      --wedding-mobile-vh:1vh;
    }

    html,
    body,
    #ip-wedding-root{
      width:100%;
      margin:0;
      padding:0;
      background:#050603;
    }

    html{
      min-height:100%;
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      min-height:calc(var(--wedding-vh) * 100);
      overflow-x:hidden;
    }

    #ip-wedding-root{
      position:relative;
      min-height:100vh;
      min-height:calc(var(--wedding-vh) * 100);
    }

    @media (min-width:768px){

      html,
      body,
      #ip-wedding-root{
        width:100%;
        height:100%;
        min-height:100%;
        overflow:hidden;
      }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="preload" href="./assets/img/wedding/mobile/background/wedding-mobile-bg.webp" as="image">
  <link rel="preload" href="./assets/img/wedding/video/wedding-video-poster.webp" as="image">

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">

</head>

<body>

  <div
    class="ip-page-transition is-enter"
    aria-hidden="true"
  ></div>

  <div id="ip-wedding-root"></div>

  <script>
    (function(){
      'use strict';

      var MOBILE_BREAKPOINT = 767;

      var root = document.getElementById('ip-wedding-root');

      function isMobileViewport(){
        return window.innerWidth <= MOBILE_BREAKPOINT;
      }

      function setWeddingViewportHeight(){
        var height = window.innerHeight;

        if(window.visualViewport && window.visualViewport.height){
          height = window.visualViewport.height;
        }

        document.documentElement.style.setProperty(
          '--wedding-vh',
          (height * 0.01) + 'px'
        );

        document.documentElement.style.setProperty(
          '--wedding-mobile-vh',
          (height * 0.01) + 'px'
        );
      }

      function loadStylesheet(href){
        return new Promise(function(resolve, reject){
          var existing = document.querySelector(
            'link[href="' + href + '"]'
          );

          if(existing){
            resolve();
            return;
          }

          var link = document.createElement('link');

          link.rel = 'stylesheet';
          link.href = href;

          link.onload = resolve;
          link.onerror = reject;

          document.head.appendChild(link);
        });
      }

      function loadScript(src){
        return new Promise(function(resolve, reject){
          var script = document.createElement('script');

          script.src = src;
          script.defer = true;

          script.onload = resolve;
          script.onerror = reject;

          document.body.appendChild(script);
        });
      }

      function getPageConfig(){
        if(isMobileViewport()){
          return {
            css:[
              './css/wedding-mobile.css'
            ],
            html:'./pages/wedding/wedding-mobile.html',
            js:'./js/wedding-mobile.js',
            error:'Ошибка загрузки мобильной страницы Свадьба. Проверь путь: pages/wedding/wedding-mobile.html'
          };
        }

        return {
          css:[
            './css/wedding.css',
            './css/project-reviews.css'
          ],
          html:'./pages/wedding/wedding.html',
          js:'./js/wedding.js',
          error:'Ошибка загрузки страницы Свадьба. Проверь путь: pages/wedding/wedding.html'
        };
      }

      function initViewportListeners(){
        setWeddingViewportHeight();

        window.addEventListener(
          'resize',
          setWeddingViewportHeight,
          { passive:true }
        );

        window.addEventListener(
          'orientationchange',
          function(){
            window.setTimeout(setWeddingViewportHeight, 250);
          },
          { passive:true }
        );

        if(window.visualViewport){
          window.visualViewport.addEventListener(
            'resize',
            setWeddingViewportHeight,
            { passive:true }
          );
        }
      }

      function initPage(){
        var config = getPageConfig();

        Promise.all(
          config.css.map(function(href){
            return loadStylesheet(href);
          })
        )
          .then(function(){
            return fetch(config.html);
          })
          .then(function(response){

            if(!response.ok){
              throw new Error(config.error);
            }

            return response.text();
          })
          .then(function(html){

            root.innerHTML = html;

            return loadScript(config.js);
          })
          .then(function(){
            return loadScript('./js/page-transition.js');
          })
          .catch(function(error){

            console.error(error);

            document.body.style.background =
              '#050603';

            document.body.innerHTML =
              '<pre style="color:#fff;padding:40px;font-family:Arial,sans-serif;">' +
              config.error +
              '</pre>';
          });
      }

      if(!root){
        return;
      }

      initViewportListeners();
      initPage();

    })();
  </script>

</body>
</html>
