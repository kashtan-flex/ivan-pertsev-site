<!--
==================================================
COOPERATION PREVIEW HTML

Версия: cooperation-preview-html-001-desktop

ИЗМЕНЕНИЯ:
- создан desktop preview страницы «Сотрудничество»
- подключена desktop-страница pages/cooperation/cooperation.html
- подключены home.css для утверждённой системы меню, popups.css, popups-mobile.css, page-transition.css и cooperation.css
- подключены cooperation.js и page-transition.js
- добавлены preload для cooperation desktop background, glow и portrait
- mobile-версия не создавалась и не подключалась
==================================================
-->

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Сотрудничество — Иван Перцев</title>

  <style>
    html,
    body,
    #ip-cooperation-root{
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      background:#050603;
      overflow:hidden;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="preload" href="./assets/img/cooperation/background/cooperation-bg.webp" as="image">
  <link rel="preload" href="./assets/img/cooperation/background/cooperation-bg-glow.webp" as="image">
  <link rel="preload" href="./assets/img/cooperation/portrait/cooperation-portrait.webp" as="image">

  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/popups.css">
  <link rel="stylesheet" href="./css/popups-mobile.css">
  <link rel="stylesheet" href="./css/page-transition.css">
  <link rel="stylesheet" href="./css/cooperation.css">
</head>

<body>

  <div class="ip-page-transition is-enter" aria-hidden="true"></div>
  <div id="ip-cooperation-root"></div>

  <script>
    fetch('./pages/cooperation/cooperation.html')
      .then(function(response){
        return response.text();
      })
      .then(function(html){
        document.getElementById('ip-cooperation-root').innerHTML = html;

        var pageScript = document.createElement('script');
        pageScript.src = './js/cooperation.js';
        document.body.appendChild(pageScript);

        var transitionScript = document.createElement('script');
        transitionScript.src = './js/page-transition.js';
        document.body.appendChild(transitionScript);
      });
  </script>

</body>
</html>
